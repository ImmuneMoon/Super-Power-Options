name: Build (Windows / macOS / Linux)

on:
  push:
    branches: [main, master]
    tags: ["v*", "[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach builds to a GitHub Release on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SuperPowerOptions-Windows
          - os: macos-latest
            artifact: SuperPowerOptions-macOS
          - os: ubuntu-22.04   # older glibc = runs on more distros
            artifact: SuperPowerOptions-Linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Platform self-check
        run: python -m PowerApp.PowerPlatform

      - name: Build
        run: pyinstaller --noconfirm Super_Power_Options.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Super Power Options.exe" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Super Power Options.app" "${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x "dist/Super Power Options"
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist "Super Power Options"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz

